<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Verification Form - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .form-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #e74c3c; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #3498db; }
        
        .submit-btn { background: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #c0392b; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-weight: bold; }
        .section-title { color: #2980b9; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="form-container">
        <a href="services.html" class="back-btn">← Back to Services</a>
        <h2>👮 Tenant Police Verification</h2>
        <p class="subtitle">कृपया किरायेदार और मकान मालिक की सही जानकारी भरें</p>

        <form id="verificationForm">
            <h4 class="section-title">किरायेदार की जानकारी (Tenant Details)</h4>
            
            <div class="form-group">
                <label>किरायेदार का पूरा नाम *</label>
                <input type="text" id="tenantName" required placeholder="जैसे: Rahul Kumar">
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर *</label>
                <input type="tel" id="tenantPhone" required pattern="[0-9]{10}" placeholder="10 अंकों का मोबाइल नंबर">
            </div>
            <div class="form-group">
                <label>आधार कार्ड नंबर *</label>
                <input type="text" id="aadharNumber" required pattern="[0-9]{12}" placeholder="12 अंकों का आधार नंबर">
            </div>
            <div class="form-group">
                <label>किरायेदार का स्थायी पता (Permanent Address) *</label>
                <textarea id="tenantPermanentAddress" rows="2" required placeholder="गाँव/शहर का पूरा स्थायी पता..."></textarea>
            </div>
            <div class="form-group">
                <label>स्थायी पते का पुलिस स्टेशन (Permanent Police Station) *</label>
                <input type="text" id="permanentPoliceStation" required placeholder="जैसे: थाना मिसरोद / थाना कोतवाली">
            </div>

            <h4 class="section-title">मकान मालिक एवं प्रॉपर्टी (Owner & Property Details)</h4>
            
            <div class="form-group">
                <label>मकान मालिक का नाम *</label>
                <input type="text" id="ownerName" required placeholder="जैसे: Suresh Sharma">
            </div>
            <div class="form-group">
                <label>मालिक का मोबाइल नंबर *</label>
                <input type="tel" id="ownerPhone" required pattern="[0-9]{10}" placeholder="10 अंकों का मोबाइल नंबर">
            </div>
            <div class="form-group">
                <label>किराये की प्रॉपर्टी का पूरा पता (Current Address) *</label>
                <textarea id="propertyAddress" rows="2" required placeholder="मकान नंबर, एरिया, भोपाल..."></textarea>
            </div>
            <div class="form-group">
                <label>वर्तमान पते का पुलिस स्टेशन (Current Police Station) *</label>
                <input type="text" id="currentPoliceStation" required placeholder="भोपाल का मौजूदा थाना (जहां अभी किराये पर रहेंगे)">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Submit Verification Request 🚀</button>
        </form>
    </div>

    <script>
        document.getElementById('verificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Submitting... ⏳";
            btn.disabled = true;

            // सारा डेटा इकट्ठा करना (नए फील्ड्स के साथ)
            const data = {
                tenantName: document.getElementById('tenantName').value,
                tenantPhone: document.getElementById('tenantPhone').value,
                aadharNumber: document.getElementById('aadharNumber').value,
                tenantPermanentAddress: document.getElementById('tenantPermanentAddress').value,
                permanentPoliceStation: document.getElementById('permanentPoliceStation').value,
                ownerName: document.getElementById('ownerName').value,
                ownerPhone: document.getElementById('ownerPhone').value,
                propertyAddress: document.getElementById('propertyAddress').value,
                currentPoliceStation: document.getElementById('currentPoliceStation').value
            };

            try {
                const res = await fetch('/api/submit-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                if (result.success) {
                    alert(result.message);
                    window.location.href = 'services.html'; 
                } else {
                    alert("❌ कुछ गड़बड़ हुई। फिर से कोशिश करें।");
                    btn.innerText = "Submit Verification Request 🚀";
                    btn.disabled = false;
                }
            } catch (error) {
                alert("❌ सर्वर एरर!");
                btn.innerText = "Submit Verification Request 🚀";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
