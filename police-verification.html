<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Verification Form - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .form-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #e74c3c; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .submit-btn { background: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #c0392b; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-weight: bold; }
        .section-title { color: #2980b9; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="form-container">
        <a href="services.html" class="back-btn">← Back to Services</a>
        <h2>👮 Tenant Police Verification</h2>
        <p class="subtitle">Kripya tenant aur landlord ki sahi jankari bharein</p>

        <form id="verificationForm">
            <h4 class="section-title">Tenant Details (किरायेदार की जानकारी)</h4>
            
            <div class="form-group">
                <label>Tenant Ka Pura Naam *</label>
                <input type="text" id="tenantName" required placeholder="Jaise: Rahul Kumar">
            </div>
            <div class="form-group">
                <label>Tenant Ki Passport Photo Upload Karein *</label>
                <input type="file" id="tenantPhoto" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Family Me Kitne Member Hain? *</label>
                <input type="number" id="familyMembers" min="1" required placeholder="Jaise: 4">
            </div>
            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" id="tenantPhone" required pattern="[0-9]{10}" placeholder="10 digits number">
            </div>
            <div class="form-group">
                <label>Aadhar Card Number *</label>
                <input type="text" id="aadharNumber" required pattern="[0-9]{12}" placeholder="12 digits number">
            </div>
            <div class="form-group">
                <label>Tenant Ka Sthayi Pata (Permanent Address) *</label>
                <textarea id="tenantPermanentAddress" rows="2" required placeholder="Pura permanent pata..."></textarea>
            </div>
            <div class="form-group">
                <label>Sthayi Pate Ka Police Station *</label>
                <input type="text" id="permanentPoliceStation" required placeholder="Jaise: Thana Misrod">
            </div>

            <h4 class="section-title">Owner & Property Details (मकान मालिक की जानकारी)</h4>
            
            <div class="form-group">
                <label>Makan Malik Ka Naam *</label>
                <input type="text" id="ownerName" required placeholder="Jaise: Suresh Sharma">
            </div>
            <div class="form-group">
                <label>Malik Ka Mobile Number *</label>
                <input type="tel" id="ownerPhone" required pattern="[0-9]{10}" placeholder="10 digits number">
            </div>
            <div class="form-group">
                <label>Kiraye Ki Property Ka Pura Pata *</label>
                <textarea id="propertyAddress" rows="2" required placeholder="Makan number, area, Bhopal..."></textarea>
            </div>
            <div class="form-group">
                <label>Vartman Pate Ka Police Station (Bhopal) *</label>
                <input type="text" id="currentPoliceStation" required placeholder="Bhopal ka vartman thana">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Submit Verification Request 🚀</button>
        </form>
    </div>

    <script>
        document.getElementById('verificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Uploading Photo & Submitting... ⏳";
            btn.disabled = true;

            // FormData object banana taaki file upload ho sake
            const formData = new FormData();
            formData.append('tenantName', document.getElementById('tenantName').value);
            formData.append('familyMembers', document.getElementById('familyMembers').value);
            formData.append('tenantPhone', document.getElementById('tenantPhone').value);
            formData.append('aadharNumber', document.getElementById('aadharNumber').value);
            formData.append('tenantPermanentAddress', document.getElementById('tenantPermanentAddress').value);
            formData.append('permanentPoliceStation', document.getElementById('permanentPoliceStation').value);
            formData.append('ownerName', document.getElementById('ownerName').value);
            formData.append('ownerPhone', document.getElementById('ownerPhone').value);
            formData.append('propertyAddress', document.getElementById('propertyAddress').value);
            formData.append('currentPoliceStation', document.getElementById('currentPoliceStation').value);
            
            // Photo File append karna
            const photoInput = document.getElementById('tenantPhoto');
            if (photoInput.files.length > 0) {
                formData.append('tenantPhoto', photoInput.files[0]);
            }

            try {
                const res = await fetch('/api/submit-verification', {
                    method: 'POST',
                    body: formData // Note: FormData me content-type header nahi lagate
                });
                
                const result = await res.json();
                if (result.success) {
                    alert(result.message);
                    window.location.href = 'services.html'; 
                } else {
                    alert("❌ Kuch gadbad hui. Fir se koshish karein.");
                    btn.innerText = "Submit Verification Request 🚀";
                    btn.disabled = false;
                }
            } catch (error) {
                alert("❌ Server Error!");
                btn.innerText = "Submit Verification Request 🚀";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
