<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Verification Form - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .form-container { max-width: 650px; margin: 20px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #e74c3c; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 13px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .submit-btn { background: #e74c3c; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #c0392b; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-weight: bold; }
        .section-title { color: #2980b9; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 30px; margin-bottom: 15px; font-size: 16px; }
        @media (max-width: 600px) { .form-row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

    <div class="form-container">
        <a href="services.html" class="back-btn">← Back to Services</a>
        <h2>👮 MP Police Tenant Verification</h2>
        <p class="subtitle">सिटिज़न पोर्टल के अनुसार सभी सही जानकारी भरें</p>

        <form id="verificationForm">
            <h4 class="section-title">मालिक सूचना (Owner Details)</h4>
            <div class="form-row">
                <div class="form-group">
                    <label>मालिक का नाम (Owner Name) *</label>
                    <input type="text" id="ownerName" required placeholder="Suresh Sharma">
                </div>
                <div class="form-group">
                    <label>मोबाइल नंबर (Mobile) *</label>
                    <input type="tel" id="ownerPhone" required pattern="[0-9]{10}" placeholder="10 Digits">
                </div>
            </div>
            <div class="form-group">
                <label>किराये की प्रॉपर्टी का पूरा पता (Property Address) *</label>
                <textarea id="propertyAddress" rows="2" required placeholder="मकान नंबर, कॉलोनी, एरिया..."></textarea>
            </div>
            <div class="form-group">
                <label>प्रॉपर्टी का पुलिस स्टेशन (Current Police Station) *</label>
                <select id="currentPoliceStation" required>
                    <option value="">-- पुलिस स्टेशन चुनें --</option>
                    <option value="ऐशबाग">ऐशबाग</option><option value="अरेरा हिल्स">अरेरा हिल्स</option><option value="अशोका गार्डन">अशोका गार्डन</option><option value="अवधपुरी">अवधपुरी</option><option value="अयोध्या नगर">अयोध्या नगर</option><option value="बागसेवनिया">बागसेवनिया</option><option value="बैरागढ़">बैरागढ़</option><option value="छोला मंदिर">छोला मंदिर</option><option value="चूनाभट्टी">चूनाभट्टी</option><option value="क्राइम ब्रांच">क्राइम ब्रांच</option><option value="गाँधी नगर">गाँधी नगर</option><option value="गौतम नगर">गौतम नगर</option><option value="गोविन्दपुरा">गोविन्दपुरा</option><option value="हबीब गंज">हबीब गंज</option><option value="हनुमानगंज">हनुमानगंज</option><option value="जहाँगीराबाद">जहाँगीराबाद</option><option value="कजलीखेड़ा">कजलीखेड़ा</option><option value="कमला नगर">कमला नगर</option><option value="कटारा हिल्स">कटारा हिल्स</option><option value="खजूरी सड़क">खजूरी सड़क</option><option value="कोहेफिजा">कोहेफिजा</option><option value="कोलार रोड">कोलार रोड</option><option value="कोतवाली भोपाल">कोतवाली भोपाल</option><option value="महाराणाप्रताप नगर">महाराणाप्रताप नगर (MP Nagar)</option><option value="महिला थाना">महिला थाना</option><option value="मंगलवारा">मंगलवारा</option><option value="मिसरोद">मिसरोद</option><option value="निशातपुरा">निशातपुरा</option><option value="पिपलानी">पिपलानी</option><option value="यातायात थाना भोपाल">यातायात थाना भोपाल</option><option value="रातीबड़">रातीबड़</option><option value="शाहजहानाबाद">शाहजहानाबाद</option><option value="शाहपुरा">शाहपुरा</option><option value="श्यामला हिल्स">श्यामला हिल्स</option><option value="स्टेशन बजरिया">स्टेशन बजरिया</option><option value="टी टी नगर">टी टी नगर (TT Nagar)</option><option value="तलैया">तलैया</option><option value="टीलाजमालपुरा">टीलाजमालपुरा</option>
                </select>
            </div>

            <h4 class="section-title">किरायेदार सूचना (Tenant Details)</h4>
            <div class="form-row">
                <div class="form-group">
                    <label>किरायेदार का नाम (Tenant Name) *</label>
                    <input type="text" id="tenantName" required placeholder="First & Last Name">
                </div>
                <div class="form-group">
                    <label>पिता/पति का नाम (Father/Husband) *</label>
                    <input type="text" id="tenantFatherName" required placeholder="Relative Name">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>जन्म तिथि (DOB) *</label>
                    <input type="date" id="tenantDOB" required>
                </div>
                <div class="form-group">
                    <label>मोबाइल नंबर (Mobile) *</label>
                    <input type="tel" id="tenantPhone" required pattern="[0-9]{10}" placeholder="10 Digits">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>आधार कार्ड (Aadhar Number) *</label>
                    <input type="text" id="aadharNumber" required pattern="[0-9]{12}" placeholder="12 Digits">
                </div>
                <div class="form-group">
                    <label>परिवार के सदस्य (Family Members) *</label>
                    <input type="number" id="familyMembers" min="1" required placeholder="Count">
                </div>
            </div>
            <div class="form-group">
                <label>किरायेदार की पासपोर्ट फोटो (Passport Photo) *</label>
                <input type="file" id="tenantPhoto" accept="image/*" required>
            </div>

            <h4 class="section-title">स्थायी पता (Permanent Address)</h4>
            <div class="form-group">
                <label>किरायेदार का स्थायी पता (Permanent Address) *</label>
                <textarea id="tenantPermanentAddress" rows="2" required placeholder="पूरा पता (House, Village, City, State)"></textarea>
            </div>
            <div class="form-group">
                <label>स्थायी पते का पुलिस स्टेशन (Permanent P.S.) *</label>
                <input type="text" id="permanentPoliceStation" required placeholder="स्थायी थाने का नाम">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Submit Verification Request 🚀</button>
        </form>
    </div>

    <script>
    let isPaymentBypassedGlobal = false;

    // 🌟 1. Page load होते ही लाइव पेमेंट स्टेटस चेक करेगा और बटन का नाम बदलेगा
    document.addEventListener('DOMContentLoaded', async () => {
        const userEmail = localStorage.getItem('brokerEmail');
        if (!userEmail) {
            alert('कृपया पहले लॉगिन करें!');
            window.location.href = 'login.html'; 
            return;
        }

        try {
            const res = await fetch('/api/payment-status');
            const data = await res.json();
            isPaymentBypassedGlobal = data.isPaymentBypassed;
        } catch (e) {
            console.error("Error fetching payment status:", e);
        }

        const btn = document.getElementById('submitBtn');
        if (isPaymentBypassedGlobal) {
            btn.innerText = "Submit Verification Request (FREE) 🚀";
            btn.style.backgroundColor = "#e67e22"; // Orange color for Free Mode
        } else {
            btn.innerText = "Pay ₹10 & Submit Request 💳";
            btn.style.backgroundColor = "#3498db"; // Blue color for Paid Mode
        }
    });

    // 🌟 2. Form Submit होने पर काम करने वाला मेन फंक्शन
    document.getElementById('verificationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerText;
        btn.innerText = "Please Wait... ⏳";
        btn.disabled = true;

        const userEmail = localStorage.getItem('brokerEmail') || 'guest@user.com';

        // फ़ॉर्म का सारा डेटा इकट्ठा करें
        const formData = new FormData();
        formData.append('userEmail', userEmail);
        formData.append('ownerName', document.getElementById('ownerName').value);
        formData.append('ownerPhone', document.getElementById('ownerPhone').value);
        formData.append('propertyAddress', document.getElementById('propertyAddress').value);
        formData.append('currentPoliceStation', document.getElementById('currentPoliceStation').value);
        formData.append('tenantName', document.getElementById('tenantName').value);
        formData.append('tenantFatherName', document.getElementById('tenantFatherName').value);
        formData.append('tenantDOB', document.getElementById('tenantDOB').value);
        formData.append('tenantPhone', document.getElementById('tenantPhone').value);
        formData.append('aadharNumber', document.getElementById('aadharNumber').value);
        formData.append('familyMembers', document.getElementById('familyMembers').value);
        formData.append('tenantPermanentAddress', document.getElementById('tenantPermanentAddress').value);
        formData.append('permanentPoliceStation', document.getElementById('permanentPoliceStation').value);
        
        const photoInput = document.getElementById('tenantPhoto');
        if (photoInput.files.length > 0) formData.append('tenantPhoto', photoInput.files[0]);

        // 🔓 CONDITION A: अगर मास्टर कंट्रोल स्विच FREE MODE (Bypass) पर है
        if (isPaymentBypassedGlobal) {
            const freeTxnId = 'FREE_VERIFY_' + Math.random().toString(36).substring(2, 10).toUpperCase();
            btn.innerText = "Bypass Verified! Uploading... 🔓";
            
            // डेटाबेस में वेरिफिकेशन डेटा और साथ ही यूनिवर्सल रसीद जनरेट करवाएंगे
            submitDataWithUniversalReceipt(formData, btn, originalText, freeTxnId, 'Tenant Police Verification (FREE)', 0, 'Bypassed (Free)');
        } 
        // 💳 CONDITION B: अगर Paid Mode एक्टिव है (Razorpay पॉपअप खुलेगा)
        else {
            try {
                btn.innerText = "Initiating Payment... 💳";
                const orderRes = await fetch('/api/create-order', { method: 'POST' });
                const orderData = await orderRes.json();
                
                if(!orderData.success) {
                    alert("❌ Payment System Error! Order create nahi hua.");
                    resetBtn(btn, originalText);
                    return;
                }

                const options = {
                    "key": "rzp_test_T3oTzNzTDvWgUL", 
                    "amount": orderData.order.amount,
                    "currency": "INR",
                    "name": "Bhopal Properties",
                    "description": "Tenant Police Verification Charges",
                    "order_id": orderData.order.id,
                    "handler": async function (response) {
                        btn.innerText = "Payment Successful! Saving... 🚀";
                        
                        // पेमेंट सफल होने पर डेटाबेस में सेव करेंगे
                        submitDataWithUniversalReceipt(formData, btn, originalText, response.razorpay_payment_id, 'Tenant Police Verification Premium', 10, 'Paid');
                    },
                    "prefill": {
                        "name": localStorage.getItem('brokerName') || "User",
                        "email": userEmail,
                        "contact": document.getElementById('tenantPhone').value
                    },
                    "theme": { "color": "#e74c3c" },
                    "modal": {
                        ondismiss: function() {
                            alert("❌ Payment Cancelled.");
                            resetBtn(btn, originalText);
                        }
                    }
                };
                
                const rzp = new Razorpay(options);
                rzp.open();
                btn.innerText = "Waiting for Payment Completion... 💳";
                btn.disabled = false;

            } catch (error) {
                console.error(error);
                alert("❌ Payment Server Se Connect Nahi Ho Paya.");
                resetBtn(btn, originalText);
            }
        }
    });

    // ☁️ 3. वेरिफिकेशन डेटा सबमिट करने और यूनिवर्सल रसीद ऑटो-जनरेट करने का कम्बाइंड फंक्शन
    async function submitDataWithUniversalReceipt(formData, btn, originalText, txnId, serviceName, amt, payStatus) {
        try {
            // A. पहले वेरिफिकेशन का फॉर्म डेटा सबमिट करें
            const saveRes = await fetch('/api/submit-verification', { method: 'POST', body: formData });
            const result = await saveRes.json();
            
            if (result.success) {
                // B. वेरिफिकेशन सफल होने पर, तुरंत यूनिवर्सल रसीद कलेक्शन में डेटा सिंक करें
                const receiptData = {
                    userEmail: localStorage.getItem('brokerEmail'),
                    serviceName: serviceName,
                    transactionId: txnId,
                    amountPaid: amt,
                    paymentStatus: payStatus
                };

                await fetch('/api/save-receipt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(receiptData)
                });

                alert("✅ वेरिफिकेशन रिक्वेस्ट और इनवॉइस सफलतापूर्वक जनरेट हो गए हैं!");
                
                // C. यूजर को रसीद का प्रिंटआउट दिखाने के लिए भेजें
                window.location.href = `receipt.html?txn=${txnId}&service=${encodeURIComponent(serviceName)}&amount=${amt}`;
                
            } else {
                alert('❌ डेटा सेव करने में सर्वर एरर आया: ' + result.message);
                resetBtn(btn, originalText);
            }
        } catch (error) {
            console.error(error);
            alert('❌ सर्वर से जुड़ने में समस्या आई।');
            resetBtn(btn, originalText);
        }
    }

    function resetBtn(btn, text) {
        btn.innerText = text;
        btn.disabled = false;
    }
</script>
</body>
</html>
