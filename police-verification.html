<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Verification Form - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; border-top: 5px solid #27ae60; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type="text"], input[type="number"], input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .submit-btn { width: 100%; background-color: #e67e22; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background-color: #d35400; }
        .loader-text { text-align: center; color: #27ae60; font-weight: bold; display: none; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>👮 Police Verification Form</h2>
        <p style="text-align: center; color: #7f8c8d; margin-top: -10px; margin-bottom: 20px;">किरायेदार की डिटेल भरें</p>

        <form id="policeForm">
            <div class="form-group">
                <label>Tenant Name (किरायेदार का नाम)</label>
                <input type="text" name="tenantName" required placeholder="Full Name">
            </div>

            <div class="form-group">
                <label>Mobile Number (मोबाइल नंबर)</label>
                <input type="number" name="tenantMobile" required placeholder="10-digit mobile number">
            </div>

            <div class="form-group">
                <label>Aadhaar Number (आधार नंबर)</label>
                <!-- Privacy compliance placeholder -->
                <input type="text" name="tenantAadhaar" required placeholder="Enter 12-digit number" maxlength="12">
            </div>

            <div class="form-group">
                <label>Select Police Station (थाना क्षेत्र)</label>
                <select name="policeStation" required>
                    <option value="">-- Select Area --</option>
                    <option value="MP Nagar">MP Nagar</option>
                    <option value="Habibganj">Habibganj</option>
                    <option value="Bairagarh">Bairagarh</option>
                    <option value="Kolar">Kolar</option>
                    <option value="Other">Other (अन्य)</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Save & Proceed to Pay (₹149)</button>
            <p class="loader-text" id="loaderText">Saving your details... Please wait ⏳</p>
        </form>
    </div>

    <script>
        document.getElementById('policeForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // पेज को रीलोड होने से रोकना
            
            const submitBtn = document.getElementById('submitBtn');
            const loaderText = document.getElementById('loaderText');
            
            // बटन छुपाएं और लोडर दिखाएं
            submitBtn.style.display = 'none';
            loaderText.style.display = 'block';

            // फॉर्म का डेटा इकट्ठा करना
            const formData = {
                tenantName: this.tenantName.value,
                tenantMobile: this.tenantMobile.value,
                tenantAadhaar: this.tenantAadhaar.value,
                policeStation: this.policeStation.value,
                service: "Police Verification",
                amount: "149"
            };

            try {
                // 🌟 यहाँ हम आपके सर्वर पर डेटा ड्राफ्ट (हवा में) सेव कर रहे हैं
                const response = await fetch('/api/save-police-draft', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();

                if (data.success) {
                    // ड्राफ्ट सेव होते ही सीधा पेमेंट पेज पर भेज देना (draftId के साथ)
                    window.location.href = `payment.html?amount=149&service=Police+Verification&draftId=${data.draftId}`;
                } else {
                    alert("Error saving details: " + data.message);
                    submitBtn.style.display = 'block';
                    loaderText.style.display = 'none';
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Server error! Please try again.");
                submitBtn.style.display = 'block';
                loaderText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
