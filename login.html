<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bhopal Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .login-card:hover { transform: translateY(-5px); }

        .logo { font-size: 28px; font-weight: 700; color: #2c3e50; margin-bottom: 5px; letter-spacing: -0.5px; }
        .logo span { color: #27ae60; }
        .subtitle { color: #576574; font-size: 14px; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-weight: 600; color: #2c3e50; margin-bottom: 8px; font-size: 14px; }
        
        .input-group input { 
            width: 100%; padding: 15px; border: 2px solid transparent; border-radius: 12px; 
            font-size: 15px; transition: all 0.3s ease; outline: none; background: #f1f2f6;
            color: #2c3e50; font-weight: 500;
        }
        
        .input-group input:focus { 
            border-color: #3498db; background: white;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.15); 
        }
        
        .login-btn {
            width: 100%; padding: 15px; background: #27ae60; color: white; border: none;
            border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; 
            transition: all 0.3s ease; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.2);
        }
        
        .login-btn:hover { 
            background: #219653; transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.4); 
        }
        
        .signup-link { margin-top: 25px; font-size: 14px; color: #576574; }
        .signup-link a { color: #2980b9; text-decoration: none; font-weight: 600; transition: color 0.3s ease; }
        .signup-link a:hover { color: #1a5276; text-decoration: underline; }
        
        #errorMsg { 
            background: #ffeaa7; color: #d63031; padding: 10px; border-radius: 8px; 
            font-size: 14px; margin-bottom: 20px; display: none; font-weight: 500; 
            border-left: 4px solid #d63031;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">Bhopal <span>Properties</span> 🏠</div>
        <p class="subtitle">Welcome back! Please login to your account.</p>
        
        <div id="errorMsg">Invalid email or password.</div>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Log In 🚀</button>
        </form>
        
        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.innerText = "Verifying... ⏳";
            btn.style.opacity = "0.8";
            errorMsg.style.display = "none";
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('brokerName', data.name);
                    localStorage.setItem('brokerEmail', data.email);
                    localStorage.setItem('userRole', data.role);
                    
                    btn.innerText = "Login Successful! ✅";
                    btn.style.background = "#2ecc71";
                    
                    setTimeout(() => {
                        window.location.href = data.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
                    }, 1000);
                } else {
                    errorMsg.innerText = "❌ " + data.message;
                    errorMsg.style.display = "block";
                    btn.innerText = "Log In 🚀";
                    btn.style.opacity = "1";
                }
            } catch (error) {
                errorMsg.innerText = "❌ Server Error! Please try again.";
                errorMsg.style.display = "block";
                btn.innerText = "Log In 🚀";
                btn.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
