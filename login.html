<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Bhopal Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 420px; text-align: center; }
        .logo { font-size: 28px; font-weight: 700; color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-weight: 600; color: #2c3e50; margin-bottom: 8px; font-size: 14px; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid transparent; border-radius: 12px; outline: none; font-size: 14px; }
        .form-group input:focus { border-color: #f59e0b; }
        .save-btn { background: #10b981; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .logout-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        .logout-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">Bhopal <span>Properties</span> 🏠</div>
        <div id="errorMsg" style="background: #ffeaa7; color: #d63031; padding: 10px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px;"></div>
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="logout-btn" id="loginBtn" style="background-color: #27ae60;">Log In 🚀</button>
        </form>
        <div class="bottom-link" style="margin-top: 20px; font-size: 14px; color: #576574;">
            Don't have an account? <a href="signup.html" style="color: #2980b9; text-decoration: none; font-weight: bold;">Sign Up here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            btn.innerText = "Verifying...";
            errorMsg.style.display = "none";
            
            try {
                // 1. Purane kisi bhi stale cache ko pehle clean karein
                localStorage.clear();

                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: document.getElementById('email').value.trim(), 
                        password: document.getElementById('password').value 
                    })
                });

                const data = await res.json();
                
                if (data.success) {
                    // 🚪 CHECK 1: अगर लॉगिन करने वाला एक किरायेदार (Tenant) है
                    if (data.role === 'tenant') {
                        localStorage.setItem('tenantEmail', data.tenantData.tenantEmail);
                        localStorage.setItem('userRole', 'tenant');
                        localStorage.setItem('brokerName', data.tenantData.tenantName);
                        // 🔴 किरायेदार का सुरक्षित टोकन यहाँ सेव हो रहा है
                        localStorage.setItem('authToken', data.token);
                        window.location.href = 'tenant-dashboard.html'; // सीधे रीड-ओनली खाता पोर्टल पर भेजें
                        return;
                    }

                    // 💼 CHECK 2: अगर सामान्य यूजर, ब्रोकर या कोई अन्य एजेंट है
                    localStorage.setItem('brokerName', data.name);
                    localStorage.setItem('brokerEmail', data.email);
                    localStorage.setItem('userRole', data.role);
                    // 🔴 एडमिन / यूजर का सुरक्षित टोकन यहाँ सेव हो रहा है
                    localStorage.setItem('authToken', data.token);

                    const cleanRole = data.role ? data.role.trim() : '';

                    // 3. Routing Engine Execution (Aapke Saare Purane Logics Block)
                    if (cleanRole === 'admin') {
                        window.location.replace('admin-dashboard.html');
                    } else if (cleanRole === 'police_agent') {
                        window.location.replace('police-dashboard.html');
                    } else if (cleanRole === 'notary') {
                        window.location.replace('notary-dashboard.html');
                    } else if (cleanRole === 'loan_agent') {
                        window.location.replace('loan-dashboard.html');
                    } else if (cleanRole === 'transporter') {
                        window.location.replace('transporter-dashboard.html');
                    } else if (cleanRole === 'rk_decorator') {
                        window.location.replace('rk-dashboard.html');
                    } else {
                        window.location.replace('dashboard.html');
                    }
                } else {
                    errorMsg.innerText = "❌ " + (data.message || "लॉगिन विफल!");
                    errorMsg.style.display = "block";
                    btn.innerText = "Log In 🚀";
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "❌ Server Error!";
                errorMsg.style.display = "block";
                btn.innerText = "Log In 🚀";
            }
        });
    </script>
</body>
</html>
