<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhopal Real Estate - Find Your Dream Home</title>
    <link rel="stylesheet" href="home-style.css">
    <style>
        /* प्रॉपर्टी कार्ड्स को सुंदर दिखाने के लिए स्टाइल */
        .property-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #eee; display: flex; flex-direction: column; }
        .property-img { width: 100%; height: 200px; object-fit: cover; }
        .property-details { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .prop-title { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 0; }
        .prop-loc { font-size: 14px; color: #7f8c8d; margin: 0; }
        .prop-price { font-size: 16px; font-weight: bold; color: #27ae60; margin: 0; }
        .prop-desc { font-size: 13px; color: #555; margin: 0; line-height: 1.4; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; width: fit-content; }
        .badge-rent { background-color: #f1c40f; color: #2c3e50; }
        .badge-sell { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Bhopal Properties</div>
        <nav>
            <ul>
                <li><a href="#" onclick="loadAllProperties()">होम</a></li>
                <li><a href="#" onclick="filterByPurpose('Rent')">किराए के लिए</a></li>
                <li><a href="#" onclick="filterByPurpose('Sell')">खरीदने के लिए</a></li>
                <li><a href="/login.html" class="login-btn">लॉगिन / साइन-अप</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>अपने सपनों का घर ढूँढें</h1>
        <p>भोपाल में किराये और खरीदने के लिए बेहतरीन प्रॉपर्टीज़</p>
        
        <div class="search-box">
            <select id="searchPurpose">
                <option value="all">सब कुछ देखें</option>
                <option value="Sell">खरीदें (Buy)</option>
                <option value="Rent">किराए पर (Rent)</option>
            </select>
            
            <select id="searchLocation">
                <option value="">लोकेशन चुनें...</option>
                <option value="MP Nagar Zone 1">MP Nagar Zone 1 (एम.पी. नगर जोन 1)</option>
                <option value="MP Nagar Zone 2">MP Nagar Zone 2 (एम.पी. नगर जोन 2)</option>
                <option value="New Market">New Market (न्यू मार्केट)</option>
                <option value="TT Nagar">TT Nagar (टी.टी. नगर)</option>
                <option value="Malviya Nagar">Malviya Nagar (मालवीय नगर)</option>
                <option value="Arera Colony">Arera Colony (अरेरा कॉलोनी)</option>
                <option value="Shahpura">Shahpura (शाहपुरा)</option>
                <option value="Chunabhatti">Chunabhatti (चूनाभट्टी)</option>
                <option value="Char Imli">Char Imli (चार इमली)</option>
                <option value="Gulmohar">Gulmohar (गुलमोहर)</option>
                <option value="Kolar Road">Kolar Road (कोलार रोड)</option>
                <option value="Awadhpuri">Awadhpuri (अवधपुरी)</option>
                <option value="Ayodhya Bypass">Ayodhya Bypass (अयोध्या बाईपास)</option>
                <option value="Hoshangabad Road">Hoshangabad Road (होशंगाबाद रोड)</option>
                <option value="Katara Hills">Katara Hills (कटारा हिल्स)</option>
                <option value="Bawadiya Kalan">Bawadiya Kalan (बावड़िया कलां)</option>
                <option value="Indrapuri">Indrapuri (इंद्रपुरी)</option>
                <option value="Piplani">Piplani (पिपलानी)</option>
                <option value="Saket Nagar">Saket Nagar (साकेत नगर)</option>
                <option value="Sonagiri">Sonagiri (सोनागिरी)</option>
                <option value="Anand Nagar">Anand Nagar (आनंद नगर)</option>
                <option value="Kohefiza">Kohefiza (कोहेफिजा)</option>
                <option value="Lalghati">Lalghati (लालघाटी)</option>
                <option value="Bairagarh">Bairagarh (बैरागढ़)</option>
                <option value="Jahangirabad">Jahangirabad (जहांगीराबाद)</option>
                <option value="Karond">Karond (करौंद)</option>
                <option value="Gandhi Nagar">Gandhi Nagar (गांधी नगर)</option>
            </select>
            
            <button onclick="searchProperties()">सर्च करें</button>
        </div>
    </section>

    <section class="properties-section" style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 30px; color: #2c3e50;">नवीनतम प्रॉपर्टीज (Latest Properties)</h2>
        
        <div id="propertiesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
            </div>
    </section>

    <script>
        let allPropertiesList = [];

        // 🌐 डेटाबेस से सारी प्रॉपर्टीज लोड करने का फंक्शन (Cache Trick के साथ)
        async function loadAllProperties() {
            try {
                // 🚀 ब्राउज़र का कैश (Cache) तोड़ने के लिए टाइमस्टैम्प ट्रिक
                const response = await fetch('/api/get-properties?nocache=' + new Date().getTime()); 
                allPropertiesList = await response.json();
                displayProperties(allPropertiesList);
            } catch (error) {
                console.error("होमपेज डेटा लोड एरर:", error);
            }
        }

        // 🎴 स्क्रीन पर प्रॉपर्टीज के कार्ड बनाकर दिखाने का फंक्शन
        function displayProperties(list) {
            const grid = document.getElementById('propertiesGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #7f8c8d; font-size: 16px;">वर्तमान में कोई प्रॉपर्टी उपलब्ध नहीं है।</p>`;
                return;
            }

            list.forEach(prop => {
                const priceText = prop.purpose === 'Rent' ? `₹ ${prop.price} / Month` : `₹ ${prop.price}`;
                const badgeClass = prop.purpose === 'Rent' ? 'badge-rent' : 'badge-sell';
                const badgeText = prop.purpose === 'Rent' ? 'For Rent' : 'For Sale';
                const imgSrc = prop.image ? prop.image : 'https://via.placeholder.com/350x200';

                grid.innerHTML += `
                    <div class="property-card">
                        <img src="${imgSrc}" class="property-img" alt="Property Image">
                        <div class="property-details">
                            <span class="badge ${badgeClass}">${badgeText}</span>
                            <h3 class="prop-title">${prop.title}</h3>
                            <p class="prop-loc">📍 ${prop.location}</p>
                            <p class="prop-price">${priceText}</p>
                            <p class="prop-desc">${prop.desc}</p>
                        </div>
                    </div>`;
            });
        }

        // 📑 'किराए' या 'बेचने' के आधार पर क्विक फ़िल्टर
        function filterByPurpose(purpose) {
            const filtered = allPropertiesList.filter(p => p.purpose === purpose);
            displayProperties(filtered);
        }

        // 🔍 सर्च बटन का फंक्शन (जो ड्रॉपडाउन के हिसाब से फ़िल्टर करेगा)
        function searchProperties() {
            const purpose = document.getElementById('searchPurpose').value;
            const location = document.getElementById('searchLocation').value;

            let filtered = allPropertiesList;

            if (purpose !== 'all') {
                filtered = filtered.filter(p => p.purpose === purpose);
            }
            if (location !== '') {
                filtered = filtered.filter(p => p.location === location);
            }

            displayProperties(filtered);
        }

        // 🚀 पेज लोड होते ही अपने आप डेटा खींचना शुरू करें (यह लाइन बहुत ज़रूरी है!)
        window.onload = loadAllProperties;
    </script>
</body>
</html>
