<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Care Queue - Bhopal Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 16px 24px; border-radius: 12px; border-left: 6px solid #f59e0b; margin-bottom: 20px; }
        .counter-badge { background: #ef4444; color: white; padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 15px; }
        .task-card { background: #ffffff; color: #1e293b; border-radius: 14px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .tag { display: inline-block; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; background: #dbeafe; color: #1e40af; margin-bottom: 12px; }
        .script-box { background: #fef3c7; border: 2px dashed #f59e0b; padding: 18px; border-radius: 10px; font-size: 16px; font-weight: 600; color: #78350f; margin: 15px 0; line-height: 1.6; }
        .micro-box { background: #f1f5f9; padding: 18px; border-radius: 10px; border: 1px solid #cbd5e1; margin-top: 15px; }
        .input-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        input, select { padding: 12px; border: 2px solid #94a3b8; border-radius: 8px; font-size: 15px; font-weight: 600; flex: 1; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 14px; color: white; transition: 0.2s; }
        .btn-green { background: #16a34a; }
        .btn-blue { background: #2563eb; }
        .btn-red { background: #dc2626; }
        .btn-gray { background: #64748b; }
        .locked-note { font-size: 12px; color: #dc2626; font-weight: 700; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div>
                <h2 style="font-size: 20px;">🎧 Customer Care Sequential Desk</h2>
                <p style="font-size: 12px; color: #94a3b8;">One-by-One Strict Task Queue (Web + WhatsApp Synced)</p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <span class="counter-badge" id="pendingCount">Pending Tasks: 0</span>
                <button class="btn btn-blue" onclick="window.print()">🖨️ Print Task PDF</button>
            </div>
        </div>

        <div id="taskContainer" class="task-card">
            <h3 style="text-align:center; padding:40px; color:#64748b;">⏳ टास्क लोड हो रहा है...</h3>
        </div>
    </div>

    <script>
        let currentTaskObj = null;

        async function loadCurrentTask() {
            const res = await fetch('/api/support/current-task');
            const data = await res.json();
            document.getElementById('pendingCount').innerText = `Total Pending: ${data.totalPending || 0}`;
            const box = document.getElementById('taskContainer');

            if (!data.task) {
                box.innerHTML = `<div style="text-align:center; padding:50px;">
                    <h1 style="font-size:48px;">🎉</h1>
                    <h2 style="color:#16a34a; margin-top:10px;">सारे टास्क पूरे हो गए!</h2>
                    <p style="color:#64748b; margin-top:5px;">अभी कोई कॉल पेंडिंग नहीं है।</p>
                </div>`;
                return;
            }

            const t = data.task;
            currentTaskObj = t;

            // 🔒 Micro-Permission UI Builder
            let permissionHTML = '';
           if (t.allowedActions.includes('UPDATE_METER')) {
    const photoBanner = (t.metaData && t.metaData.meterPhotoUrl) 
        ? `<div style="margin:10px 0; padding:10px; background:#dcfce7; border-radius:8px; text-align:center;">
            <p style="font-size:13px; font-weight:800; color:#166534; margin-bottom:6px;">📸 Owner द्वारा भेजी गई मीटर फोटो:</p>
            <a href="${t.metaData.meterPhotoUrl}" target="_blank"><img src="${t.metaData.meterPhotoUrl}" style="max-height:220px; border-radius:8px; border:2px solid #16a34a;"></a>
           </div>` 
        : '';

    permissionHTML += `
    <div class="micro-box">
        <div class="locked-note">🔒 MICRO-ACCESS: केवल मीटर रीडिंग और रूम लीव अनलॉक हैं (किराया व बैलेंस लॉक हैं)</div>
        ${photoBanner}
        <p style="font-size:13px; font-weight:700;">⚡ पिछली मीटर रीडिंग: <span style="color:#2563eb;">${t.metaData?.prevMeterReading || 0}</span> | रेट: ₹${t.metaData?.unitRate || 10}/Unit</p>
        <div class="input-row">
            <input type="number" id="newMeterInput" placeholder="नई मीटर रीडिंग दर्ज करें (e.g. 1250)">
            <button class="btn btn-blue" onclick="submitTask('UPDATE_METER')">⚡ Update Meter & Send Bill</button>
            <button class="btn btn-red" onclick="submitTask('MARK_LEAVE')">🚪 Room Vacated (Leave)</button>
        </div>
    </div>`;
}

            box.innerHTML = `
                <span class="tag">ACTIVE TASK #1 • ${t.taskType}</span>
                <h2 style="font-size:22px; color:#0f172a;">📞 Call To: ${t.targetName} (${t.callToRole})</h2>
                <p style="font-size:18px; font-weight:800; color:#16a34a; margin-top:4px;">📱 Mobile: <a href="tel:${t.targetPhone}" style="color:#16a34a;">${t.targetPhone}</a> | 🏠 Room: ${t.roomNo || 'N/A'}</p>

                <div class="script-box">
                    🗣️ <b>कॉल स्क्रिप्ट (यही बोलना है):</b><br>
                    "${t.scriptText}"
                </div>

                ${permissionHTML}

                <div class="micro-box" style="margin-top:15px;">
                    <label style="font-size:13px; font-weight:700;">📝 Call Feedback / Remark:</label>
                    <div class="input-row">
                        <input type="text" id="callRemark" placeholder="कॉल का फीडबैक लिखें (जैसे: Owner ने फोटो WhatsApp पर भेजी / आज पेमेंट करेंगे)">
                        <button class="btn btn-green" onclick="submitTask('DONE')">✅ Task 1 Done (Next Task ➔)</button>
                        <button class="btn btn-gray" onclick="submitTask('HOLD')">⏭️ Call Not Picked (Hold)</button>
                    </div>
                </div>
            `;
        }

        async function submitTask(actionType) {
            if (!currentTaskObj) return;
            const remark = document.getElementById('callRemark') ? document.getElementById('callRemark').value : '';
            let newMeterReading = 0;

            if (actionType === 'UPDATE_METER') {
                newMeterReading = Number(document.getElementById('newMeterInput').value);
                if (!newMeterReading) { alert("कृपया नई मीटर रीडिंग भरें!"); return; }
            }
            if (actionType === 'MARK_LEAVE') {
                if (!confirm("क्या Owner ने कन्फर्म किया है कि किरायेदार ने कमरा छोड़ दिया है?")) return;
            }

            const res = await fetch('/api/support/complete-task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskId: currentTaskObj._id, actionType, newMeterReading, remark })
            });
            const result = await res.json();
            if (result.success) {
                alert(result.message);
                loadCurrentTask();
            } else {
                alert("Error: " + result.message);
            }
        }

        window.onload = loadCurrentTask;
    </script>
</body>
</html>
