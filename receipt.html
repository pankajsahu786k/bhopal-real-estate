<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Receipt - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .receipt-box { background: white; max-width: 500px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 8px solid #2ecc71; position: relative; }
        .success-icon { font-size: 50px; color: #2ecc71; text-align: center; margin-bottom: 10px; }
        .receipt-title { text-align: center; color: #2c3e50; margin: 0 0 5px 0; font-size: 22px; font-weight: bold; }
        .receipt-subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 25px; }
        
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .info-label { color: #7f8c8d; }
        .info-value { color: #2c3e50; font-weight: bold; text-align: right; }
        
        .amount-box { background: #eafaf1; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border: 1px solid #d4efdf; }
        .amount-label { color: #27ae60; font-weight: bold; font-size: 16px; }
        .amount-value { color: #27ae60; font-weight: 800; font-size: 22px; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 30px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .btn-print { background: #2c3e50; color: white; }
        .btn-print:hover { background: #1a252f; }
        .btn-home { background: #2ecc71; color: white; }
        .btn-home:hover { background: #27ae60; }
        
        /* Print Rules: Printing ke time buttons ko chupa dega */
        @media print {
            body { background: white; padding: 0; }
            .receipt-box { box-shadow: none; border: none; padding: 0; }
            .action-buttons { display: none; }
        }
    </style>
</head>
<body>

    <div class="receipt-box">
        <div class="success-icon">✅</div>
        <div class="receipt-title">Bhopal Properties</div>
        <div class="receipt-subtitle">Payment Successful & Confirmed</div>

        <div class="info-row">
            <span class="info-label">Receipt No:</span>
            <span class="info-value" id="receiptNo">REC-839210</span>
        </div>
        <div class="info-row">
            <span class="info-label">Date & Time:</span>
            <span class="info-value" id="receiptDate">Loading...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Customer Email:</span>
            <span class="info-value" id="receiptEmail">Loading...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Service Type:</span>
            <span class="info-value" id="receiptService">Property Listing</span>
        </div>
        <div class="info-row">
            <span class="info-label">Transaction ID:</span>
            <span class="info-value" style="color: #2980b9; font-size: 12px;" id="receiptTxn">pay_XYZ123456</span>
        </div>

        <div class="amount-box">
            <span class="amount-label">Amount Paid:</span>
            <span class="amount-value" id="receiptAmount">₹10.00</span>
        </div>

        <div class="action-buttons">
            <button onclick="window.print()" class="btn btn-print">🖨️ Download / Print</button>
            <a href="dashboard.html" class="btn btn-home">🏠 Go to Dashboard</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // URL params se data read karega jo hum send karenge
            const urlParams = new URLSearchParams(window.location.search);
            
            const txnId = urlParams.get('txn') || 'N/A';
            const service = urlParams.get('service') || 'Service Payment';
            const amount = urlParams.get('amount') || '10';
            const email = localStorage.getItem('brokerEmail') || 'user@bhopal.com';
            
            // Random receipt number generation
            const randomId = 'REC-' + Math.floor(100000 + Math.random() * 900000);
            
            // Live Date formatting
            const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            const today = new Date().toLocaleDateString('en-IN', options);

            // UI dynamic injection
            document.getElementById('receiptNo').innerText = randomId;
            document.getElementById('receiptDate').innerText = today;
            document.getElementById('receiptEmail').innerText = email;
            document.getElementById('receiptService').innerText = service;
            document.getElementById('receiptTxn').innerText = txnId;
            document.getElementById('receiptAmount').innerText = `₹${amount}.00`;
        });
    </script>
</body>
</html>
