<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .payment-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; max-width: 420px; width: 100%; border-top: 5px solid #e67e22; }
        .amount { font-size: 34px; font-weight: bold; color: #2c3e50; margin: 10px 0; }
        .qr-image { border: 2px solid #ddd; border-radius: 8px; padding: 10px; margin-top: 15px; width: 220px; height: 220px; }
        
        /* टाइमर और प्रोसेस डिज़ाइन */
        .timer-box { font-size: 18px; font-weight: bold; color: #c0392b; background: #fadbd8; padding: 8px; border-radius: 6px; display: inline-block; margin-top: 10px; }
        .process-steps { text-align: left; background: #f8f9f9; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 4px solid #3498db; font-size: 14px; color: #34495e; line-height: 1.6; }
        .process-steps h4 { margin: 0 0 10px 0; color: #2980b9; text-align: center; font-size: 16px; }
        .process-steps span { font-weight: bold; color: #2c3e50; }
        
        .instruction { font-size: 14px; color: #c0392b; margin-top: 15px; font-weight: bold; }
        .status-section { margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #e67e22; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { font-size: 15px; color: #f39c12; font-weight: bold; margin-top: 15px; }
        .success-text { font-size: 16px; color: #27ae60; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="payment-box">
        <h2 style="margin: 0; color: #2c3e50;">Bhopal Properties</h2>
        <p id="serviceNameDisplay" style="color: #7f8c8d; margin-top: 5px; font-weight: 500;">Loading Service...</p>
        
        <div class="amount">₹<span id="amountDisplay">0</span></div>

        <div id="paymentDynamicArea">
            <p>Loading payment options... ⏳</p>
        </div>

        <div class="status-section" id="statusSection">
            <div class="loader" id="loader"></div>
            <p class="status-text" id="statusText">Waiting for payment confirmation...</p>
            <p class="success-text" id="successText">✅ Payment Successful!</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dynamicAmount = urlParams.get('amount') || "149"; 
        const dynamicService = urlParams.get('service') || "Premium Service";
        const draftId = urlParams.get('draftId'); 
        
        document.getElementById("serviceNameDisplay").innerText = dynamicService;

        // दोनों UPI ID यहाँ सुरक्षित हैं
        const businessUpiId = "yogitasahu777@ybl"; // मोबाइल के लिए (बिज़नेस)
        const personalUpiId = "yogitasahu777@ybl"; // डेस्कटॉप के लिए (P2P)
        const myBusinessName = "Sahu Communication";
        
        const paymentArea = document.getElementById("paymentDynamicArea");
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // टाइमर लॉजिक
        let timerInterval;
        let checkPaymentInterval;
        
        function startTimer(durationInSeconds) {
            let timer = durationInSeconds;
            const timerDisplay = document.getElementById('timeRemaining');
            
            timerInterval = setInterval(() => {
                let minutes = parseInt(timer / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                if(timerDisplay) timerDisplay.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    clearInterval(checkPaymentInterval);
                    paymentArea.innerHTML = `<h3 style="color:red;">⏳ Payment Timeout!</h3><p>Your payment session has expired. Please refresh the page to try again.</p>`;
                    document.getElementById('statusSection').style.display = 'none';
                }
            }, 1000);
        }

        async function initializePayment() {
            try {
                const response = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: draftId || 'guest_user', baseAmount: dynamicAmount }) 
                });
                const data = await response.json();

                if (data.success) {
                    const uniqueAmount = data.amount;
                    document.getElementById("amountDisplay").innerText = uniqueAmount;
                    
                    // यहाँ डिवाइस के हिसाब से UPI आईडी सेट हो रही है
                    const activeUpiId = isMobile ? businessUpiId : personalUpiId;
                    
                    // सिर्फ QR कोड बनाने के लिए UPI स्ट्रिंग (कोई क्लिकेबल लिंक नहीं है)
                    const upiLink = `upi://pay?pa=${activeUpiId}&pn=${encodeURIComponent(myBusinessName)}&am=${uniqueAmount}&cu=INR`;
                    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiLink)}`;

                    let uiHtml = `<img src="${qrApiUrl}" class="qr-image" alt="Scan to Pay">`;
                    uiHtml += `<div class="timer-box">Time Left: <span id="timeRemaining">05:00</span></div>`;

                    if (isMobile) {
                        // मोबाइल यूज़र्स के लिए स्टेप्स
                        uiHtml += `
                            <div class="process-steps">
                                <h4>👇 How to Pay?</h4>
                                <p><span>Step 1:</span> Take a <b>Screenshot</b> of this QR code.</p>
                                <p><span>Step 2:</span> Open your PhonePe, GPay, or Paytm app.</p>
                                <p><span>Step 3:</span> Tap the Scanner and select <b>'Scan from Gallery'</b> to upload the screenshot.</p>
                            </div>
                            <p class="instruction">⚠️ Warning: Please pay EXACTLY ₹${uniqueAmount}, otherwise payment will fail.</p>
                        `;
                    } else {
                        // डेस्कटॉप यूज़र्स के लिए स्टेप्स
                        uiHtml += `
                            <div class="process-steps">
                                <h4>👇 How to Pay?</h4>
                                <p><span>Step 1:</span> Open any UPI App (PhonePe/GPay/Paytm) on your mobile.</p>
                                <p><span>Step 2:</span> Scan the QR code shown above.</p>
                                <p><span>Step 3:</span> Complete the payment.</p>
                            </div>
                            <p class="instruction">⚠️ Warning: Please pay EXACTLY ₹${uniqueAmount}, otherwise payment will fail.</p>
                        `;
                    }
                    
                    paymentArea.innerHTML = uiHtml;
                    
                    // 5 मिनट (300 सेकंड) का टाइमर चालू करें
                    startTimer(300);

                    // पेमेंट चेकिंग
                    checkPaymentInterval = setInterval(async () => {
                        try {
                            const res = await fetch(`/api/check-payment-status?amount=${uniqueAmount}`);
                            const statusData = await res.json();

                            if (statusData.status === 'Success') {
                                clearInterval(checkPaymentInterval); 
                                clearInterval(timerInterval); 
                                document.getElementById('loader').style.display = 'none';
                                document.getElementById('statusText').style.display = 'none';
                                
                                document.getElementById('successText').innerText = "✅ Payment Successful! Saving your data...";
                                document.getElementById('successText').style.display = 'block';

                                const finalTxnId = `TXN_${uniqueAmount.replace('.', '')}`;

                                if (draftId) {
                                    try {
                                        await fetch('/api/finalize-record', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ draftId: draftId, transactionId: finalTxnId, amountPaid: uniqueAmount })
                                        });

                                        await fetch('/api/save-receipt', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({
                                                userEmail: localStorage.getItem('brokerEmail') || 'guest@bhopal.com',
                                                serviceName: dynamicService, transactionId: finalTxnId, amountPaid: uniqueAmount, paymentStatus: 'Paid'
                                            })
                                        });
                                    } catch (err) { console.error("Error finalizing:", err); }
                                }

                                setTimeout(() => {
                                    window.location.href = `receipt.html?amount=${uniqueAmount}&service=${encodeURIComponent(dynamicService)}&txn=${finalTxnId}`;
                                }, 2000);
                            }
                        } catch (error) { console.error("Status Check Error:", error); }
                    }, 3000);

                } else {
                    paymentArea.innerHTML = `<p style="color:red;">${data.message}</p>`;
                }
            } catch (e) {
                console.error("API Call Error:", e);
                paymentArea.innerHTML = `<p style="color:red;">Server disconnected.</p>`;
            }
        }

        initializePayment();
    </script>
</body>
</html>
