<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .payment-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; border-top: 5px solid #e67e22; }
        .amount { font-size: 32px; font-weight: bold; color: #2c3e50; margin: 10px 0; }
        .pay-btn { display: inline-block; background-color: #27ae60; color: white; padding: 12px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 15px; width: 80%; transition: 0.3s; border: none; cursor: pointer; }
        .pay-btn:hover { background-color: #219150; }
        .qr-image { border: 2px solid #ddd; border-radius: 8px; padding: 10px; margin-top: 15px; width: 200px; height: 200px; }
        .instruction { font-size: 13px; color: #c0392b; margin-top: 10px; font-weight: bold; }
        .status-section { margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #e67e22; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { font-size: 15px; color: #f39c12; font-weight: bold; margin-top: 15px; }
        .success-text { font-size: 18px; color: #27ae60; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="payment-box">
        <h2 style="margin: 0; color: #2c3e50;">Bhopal Properties</h2>
        <p id="serviceNameDisplay" style="color: #7f8c8d; margin-top: 5px; font-weight: 500;">Loading Service...</p>
        
        <div class="amount">₹<span id="amountDisplay">0</span></div>

        <div id="paymentDynamicArea">
            <p>Loading payment options... ⏳</p>
        </div>

        <div class="status-section" id="statusSection">
            <div class="loader" id="loader"></div>
            <p class="status-text" id="statusText">Waiting for payment confirmation... ⏳</p>
            <p class="success-text" id="successText">✅ Payment Successful!</p>
        </div>
    </div>

    <script>
        // 1. URL से डेटा निकालना
        const urlParams = new URLSearchParams(window.location.search);
        const dynamicAmount = urlParams.get('amount') || "149"; 
        const dynamicService = urlParams.get('service') || "Premium Service";
        
        // 2. स्क्रीन पर सर्विस का नाम सेट करना (अगर यह एलिमेंट नहीं होगा, तो स्क्रीन ब्लैंक हो जाएगी)
        document.getElementById("serviceNameDisplay").innerText = dynamicService;

        // आपका असली UPI ID और बिज़नेस का नाम
        const myUpiId = "yogitasahu777@ybl"; 
        const myBusinessName = "Sahu Communication";
        
        const paymentArea = document.getElementById("paymentDynamicArea");
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // 3. सर्वर से रैंडम अमाउंट माँगने का फंक्शन
        async function initializePayment() {
            try {
                const response = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        userId: 'current_user_123', 
                        baseAmount: dynamicAmount 
                    }) 
                });
                const data = await response.json();

                if (data.success) {
                    const uniqueAmount = data.amount; // सर्वर से मिला अमाउंट (जैसे 149.45)
                    document.getElementById("amountDisplay").innerText = uniqueAmount;
                    
                    const upiLink = `upi://pay?pa=${myUpiId}&pn=${encodeURIComponent(myBusinessName)}&am=${uniqueAmount}&cu=INR`;

                    // मोबाइल और डेस्कटॉप के लिए डिस्प्ले
                    if (isMobile) {
                        paymentArea.innerHTML = `
                            <a href="${upiLink}" class="pay-btn">🚀 Pay with PhonePe / GPay</a>
                            <p class="instruction">कृपया एकदम सटीक ₹${uniqueAmount} ही पे करें, वर्ना पेमेंट फेल हो जाएगा (5 मिनट के अंदर)।</p>
                        `;
                    } else {
                        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiLink)}`;
                        paymentArea.innerHTML = `
                            <img src="${qrApiUrl}" class="qr-image" alt="Scan to Pay">
                            <p class="instruction">कृपया स्कैन करके सटीक ₹${uniqueAmount} ही पे करें, वर्ना पेमेंट फेल हो जाएगा (5 मिनट के अंदर)।</p>
                        `;
                    }

                    // 4. Polling: सर्वर से पूछना कि क्या इस अमाउंट का पेमेंट आ गया?
                    const checkPaymentInterval = setInterval(async () => {
                        try {
                            const res = await fetch(`/api/check-payment-status?amount=${uniqueAmount}`);
                            const statusData = await res.json();

                            if (statusData.status === 'Success') {
                                clearInterval(checkPaymentInterval); 
                                document.getElementById('loader').style.display = 'none';
                                document.getElementById('statusText').style.display = 'none';
                                document.getElementById('successText').style.display = 'block';

                                // पेमेंट सक्सेस होने पर रसीद पेज पर भेजना
                                setTimeout(() => {
                                    window.location.href = `receipt.html?amount=${uniqueAmount}&service=${encodeURIComponent(dynamicService)}`;
                                }, 2000);
                            }
                        } catch (error) {
                            console.error("Status Check Error:", error);
                        }
                    }, 3000);

                } else {
                    paymentArea.innerHTML = `<p style="color:red;">${data.message}</p>`;
                }
            } catch (e) {
                console.error("API Call Error:", e);
                paymentArea.innerHTML = `<p style="color:red;">सर्वर से कनेक्ट नहीं हो पा रहा है।</p>`;
            }
        }

        // 5. फंक्शन को चालू करना
        initializePayment();
    </script>
</body>
</html>
