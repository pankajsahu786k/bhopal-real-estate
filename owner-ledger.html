<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Digital Ledger - Bhopal Real Estate</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 100%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .filter-section { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        select { padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
        .table-wrapper { overflow-x: auto; max-width: 100%; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; min-width: 1400px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; }
        th { background-color: #34495e; color: white; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:nth-child(even) { background-color: #f8fafc; }
        input[type="text"], input[type="number"] { width: 100%; padding: 5px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
        input:disabled, select:disabled { background-color: #e2e8f0; color: #64748b; cursor: not-allowed; }
        .btn-save { background: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-lock { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .badge-locked { background: #64748b; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .badge-left { background: #e2e8f0; color: #ef4444; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span>📋 Tenant Digital Khata Register (Excel View)</span>
        <select id="statusFilter" onchange="loadOwnerLedger()">
            <option value="Active">Show Active Tenants Only</option>
            <option value="Left">Show Left / Archived History</option>
        </select>
    </h2>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Room No</th>
                    <th>Tenant Details</th>
                    <th>Balance (Opening)</th>
                    <th>Monthly Rent</th>
                    <th>Total Rent Due</th>
                    <th>Prev Unit</th>
                    <th>Curr Unit</th>
                    <th>Units Used</th>
                    <th>Unit Rate</th>
                    <th>Light Bill</th>
                    <th>Other Charges</th>
                    <th>Net Payable</th>
                    <th>Amt Received</th>
                    <th>Payment Mode</th>
                    <th>Remainder Bal</th>
                    <th>Room Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="ledgerTableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
async function loadOwnerLedger() {
    const ownerEmail = localStorage.getItem('brokerEmail');
    const filterStatus = document.getElementById('statusFilter').value;
    
    try {
        const res = await fetch(`/api/owner/my-tenants?email=${encodeURIComponent(ownerEmail)}`);
        const result = await res.json();
        const tbody = document.getElementById('ledgerTableBody');
        tbody.innerHTML = '';

        if (!result.success || result.data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="17" style="text-align:center; padding:20px; color:#64748b;">No data found.</td></tr>`;
            return;
        }

        // फिल्टर के हिसाब से डेटा छानें (Active या Left)
        const filteredData = result.data.filter(item => item.status === filterStatus);

        filteredData.forEach(item => {
            const isRowDisabled = item.isLocked || item.status === 'Left';
            const disabledAttr = isRowDisabled ? 'disabled' : '';

            tbody.innerHTML += `
                <tr id="row-${item._id}">
                    <td><input type="text" id="room-${item._id}" value="${item.roomOrFlatNo}" ${disabledAttr}></td>
                    <td>
                        <strong style="color:#1e293b;">${item.tenantName}</strong><br>
                        <span style="font-size:11px; color:#64748b;">${item.tenantEmail}</span>
                    </td>
                    <td><input type="number" id="opening-${item._id}" value="${item.balanceOpening}" ${disabledAttr}></td>
                    <td><input type="number" id="rent-${item._id}" value="${item.monthlyRent}" ${disabledAttr}></td>
                    <td style="font-weight:bold; color:#1e293b;">₹${item.totalRentDue}</td>
                    <td><input type="number" id="prev-${item._id}" value="${item.previousUnitReading}" ${disabledAttr}></td>
                    <td><input type="number" id="curr-${item._id}" value="${item.currentUnitReading}" ${disabledAttr}></td>
                    <td style="color:#2563eb; font-weight:bold;">${item.totalUnitConsumption}</td>
                    <td><input type="number" id="rate-${item._id}" value="${item.unitRate}" ${disabledAttr}></td>
                    <td>₹${item.totalElectricityBill}</td>
                    <td><input type="number" id="other-${item._id}" value="${item.waterOrOtherCharges}" ${disabledAttr}></td>
                    <td style="font-weight:bold; color:#16a34a; font-size:14px;">₹${item.totalAmountPayable}</td>
                    <td><input type="number" id="rec-${item._id}" value="${item.amountReceived}" ${disabledAttr}></td>
                    <td>
                        <select id="mode-${item._id}" ${disabledAttr}>
                            <option value="Unpaid" ${item.paymentMode === 'Unpaid' ? 'selected' : ''}>Unpaid</option>
                            <option value="Cash" ${item.paymentMode === 'Cash' ? 'selected' : ''}>Cash</option>
                            <option value="UPI/Online" ${item.paymentMode === 'UPI/Online' ? 'selected' : ''}>UPI/Online</option>
                            <option value="Check" ${item.paymentMode === 'Check' ? 'selected' : ''}>Check</option>
                        </select>
                    </td>
                    <td style="font-weight:bold; color:#dc2626;">₹${item.remainderBalance}</td>
                    <td>
                        <select id="status-${item._id}" ${disabledAttr} style="color: ${item.status === 'Left' ? '#ef4444' : '#16a34a'}; font-weight:bold;">
                            <option value="Active" ${item.status === 'Active' ? 'selected' : ''}>🟢 Active</option>
                            <option value="Left" ${item.status === 'Left' ? 'selected' : ''}>🔴 Left Room</option>
                        </select>
                    </td>
                    <td>
                        ${isRowDisabled ? 
                            (item.status === 'Left' ? '<span class="badge-left">🚪 Archived (Left)</span>' : '<span class="badge-locked">🔒 Data Locked</span>') : 
                            `<button class="btn-save" onclick="saveRow('${item._id}', '${item.tenantEmail}', false)">💾 Save</button>
                             <button class="btn-lock" onclick="saveRow('${item._id}', '${item.tenantEmail}', true)" style="margin-left:4px;">🔒 Lock Month</button>`
                        }
                    </td>
                </tr>`;
        });
    } catch (e) {
        console.error("Error rendering ledger:", e);
    }
}

async function saveRow(id, tenantEmail, shouldLock) {
    const ownerEmail = localStorage.getItem('brokerEmail');
    const statusVal = document.getElementById(`status-${id}`).value;

    const bodyData = {
        ownerEmail,
        tenantEmail,
        roomOrFlatNo: document.getElementById(`room-${id}`).value,
        balanceOpening: document.getElementById(`opening-${id}`).value,
        monthlyRent: document.getElementById(`rent-${id}`).value,
        previousUnitReading: document.getElementById(`prev-${id}`).value,
        currentUnitReading: document.getElementById(`curr-${id}`).value,
        unitRate: document.getElementById(`rate-${id}`).value,
        waterOrOtherCharges: document.getElementById(`other-${id}`).value,
        amountReceived: document.getElementById(`rec-${id}`).value,
        paymentMode: document.getElementById(`mode-${id}`).value,
        status: statusVal,
        lockRecord: shouldLock || statusVal === 'Left'
    };

    if (statusVal === 'Left' && !confirm("चेतावनी: किरायेदार को 'Left Room' मार्क करने से यह रिकॉर्ड हमेशा के लिए लॉक हो जाएगा और आर्काइव में सुरक्षित रहेगा। क्या आप आश्वस्त हैं?")) {
        return;
    }

    try {
        const res = await fetch('/api/owner/upsert-tenant-ledger', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyData)
        });
        const data = await res.json();
        alert(data.message);
        loadOwnerLedger(); // री-फ्रेश ग्रिड डेटा
    } catch(e) { alert("Save operations failed."); }
}

window.onload = loadOwnerLedger;
</script>
</body>
</html>
