<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Agent Dashboard - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        header { background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; font-size: 14px; vertical-align: middle; }
        th { background-color: #34495e; color: white; }
        .status-Pending { background-color: #f1c40f; color: #2c3e50; padding: 4px 8px; border-radius: 4px; font-weight:bold; font-size:12px; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-top: 5px; }
        .btn-done { background-color: #2ecc71; color: white; width: 100%; }
        .pdf-input { width: 100%; margin-bottom: 5px; font-size: 11px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .close-modal { cursor: pointer; font-size: 20px; color: #e74c3c; border: none; background: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 20px;">👮 MP Police 1-Click Copy Panel</div>
        <div><button onclick="logout()" class="logout-btn">Log Out</button></div>
    </header>

    <div class="container">
        <h2 style="color: #2c3e50;">Pending Tenant Verifications</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Tenant Info & Copy</th>
                        <th>Owner Info</th>
                        <th>Status</th>
                        <th>Action (Upload PDF)</th>
                    </tr>
                </thead>
                <tbody id="verificationTableBody">
                    <tr><td colspan="5" style="text-align: center; padding: 20px;">Fetching Leads... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="copyDataModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; color:#2980b9;">📋 1-Click Copy for MP Portal</h3>
                <button class="close-modal" onclick="closeModal()">✖</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let globalRequests = [];

        document.addEventListener('DOMContentLoaded', loadVerificationRequests);

        async function loadVerificationRequests() {
            try {
                const res = await fetch('/api/admin/verifications');
                const result = await res.json();
                const tableBody = document.getElementById('verificationTableBody');
                tableBody.innerHTML = '';
                
                if (result.requests.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Koi pending request nahi mili.</td></tr>`; return;
                }
                
                globalRequests = result.requests;

                result.requests.forEach(req => {
                    let actionHtml = `
                        <input type="file" id="pdf_${req._id}" accept="application/pdf" class="pdf-input">
                        <button class="action-btn btn-done" onclick="uploadPdfAndMarkDone('${req._id}')">Upload PDF & Mark Done ✔️</button>
                    `;

                    tableBody.innerHTML += `
                        <tr>
                            <td><img src="${req.tenantPhoto || 'https://placehold.co/60x60'}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px;"></td>
                            <td>
                                <strong>${req.tenantName}</strong><br>
                                <button onclick="openCopyModal('${req._id}')" style="margin-top:5px; background:#8e44ad; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:12px; cursor:pointer; font-weight:bold;">📋 View & 1-Click Copy Data</button>
                            </td>
                            <td>${req.ownerName}<br>${req.propertyAddress}</td>
                            <td><span class="status-Pending">Pending</span></td>
                            <td style="min-width: 160px;">${actionHtml}</td>
                        </tr>
                    `;
                });
            } catch (error) { console.error(error); }
        }

        function openCopyModal(id) {
            const req = globalRequests.find(r => r._id === id);
            if(!req) return;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div style="text-align:center; margin-bottom:15px;">
                    <img src="${req.tenantPhoto || 'https://placehold.co/80x80'}" style="width:80px; height:80px; border-radius:8px; border:2px solid #34495e; object-fit:cover;"><br>
                    <button onclick="downloadImage('${req.tenantPhoto}', '${req.tenantName}_Photo.jpg')" style="margin-top:8px; background:#27ae60; color:white; border:none; padding:4px 10px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:bold;">⬇️ Download Photo</button>
                </div>
                
                <!-- 🤖 Bot Send Button -->
                <button onclick='sendToPoliceBot(${JSON.stringify(req)})' style="width:100%; background:#2980b9; color:white; border:none; padding:10px; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; margin-bottom:15px;">🤖 Send to Police Bot</button>

                <h4 style="color:#e74c3c; border-bottom:1px solid #ddd; padding-bottom:4px;">मालिक (Owner)</h4>
                ${makeCopyRow('Owner Name', req.ownerName, id, 'oname')}
                ${makeCopyRow('Owner Phone', req.ownerPhone, id, 'ophone')}
                ${makeCopyRow('Property Address', req.propertyAddress, id, 'caddr')}
                ${makeCopyRow('Police Station', req.currentPoliceStation, id, 'cps')}

                <h4 style="color:#e74c3c; border-bottom:1px solid #ddd; padding-bottom:4px; margin-top:15px;">किरायेदार (Tenant)</h4>
                ${makeCopyRow('Tenant Name', req.tenantName, id, 'tname')}
                ${makeCopyRow('Father/Husband', req.tenantFatherName || '', id, 'tfname')}
                ${makeCopyRow('DOB', req.tenantDOB || '', id, 'tdob')}
                ${makeCopyRow('Phone', req.tenantPhone, id, 'tphone')}
                ${makeCopyRow('Aadhar Number', req.aadharNumber, id, 'taadhar')}

                <h4 style="color:#e74c3c; border-bottom:1px solid #ddd; padding-bottom:4px; margin-top:15px;">आधार कार्ड की फोटो (Aadhar Photos)</h4>
                <div style="display: flex; gap: 15px; margin-top: 10px; justify-content: center;">
                    <div style="text-align: center;">
                        <p style="font-size: 12px; font-weight: bold; color: #7f8c8d; margin-bottom: 5px;">Aadhar Front</p>
                        <img src="${req.aadharFrontPhoto || 'https://placehold.co/200x120?text=Not+Uploaded'}" style="width: 100%; max-width: 200px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1;"><br>
                        <button onclick="downloadImage('${req.aadharFrontPhoto}', '${req.tenantName}_Aadhar_Front.jpg')" style="margin-top:8px; background:#27ae60; color:white; border:none; padding:4px 10px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:bold;">⬇️ Download Front</button>
                    </div>
                    <div style="text-align: center;">
                        <p style="font-size: 12px; font-weight: bold; color: #7f8c8d; margin-bottom: 5px;">Aadhar Back</p>
                        <img src="${req.aadharBackPhoto || 'https://placehold.co/200x120?text=Not+Uploaded'}" style="width: 100%; max-width: 200px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1;"><br>
                        <button onclick="downloadImage('${req.aadharBackPhoto}', '${req.tenantName}_Aadhar_Back.jpg')" style="margin-top:8px; background:#27ae60; color:white; border:none; padding:4px 10px; border-radius:4px; font-size:11px; cursor:pointer; font-weight:bold;">⬇️ Download Back</button>
                    </div>
                </div>

                <h4 style="color:#e74c3c; border-bottom:1px solid #ddd; padding-bottom:4px; margin-top:15px;">स्थायी पता (Permanent)</h4>
                ${makeCopyRow('Permanent Address', req.tenantPermanentAddress, id, 'paddr')}
                ${makeCopyRow('Permanent P.S.', req.permanentPoliceStation, id, 'pps')}
            `;
            document.getElementById('copyDataModal').style.display = 'flex';
        }

        // 🤖 Bot को डाटा भेजने वाला फंक्शन
        function sendToPoliceBot(req) {
            const tenantPayload = {
                tenantFirstName: req.tenantName ? req.tenantName.split(' ')[0] : '',
                tenantLastName: req.tenantName ? req.tenantName.split(' ').slice(1).join(' ') : '',
                phone: req.tenantPhone,
                fatherName: req.tenantFatherName || '',
                dob: req.tenantDOB || '',
                aadharNumber: req.aadharNumber || '',
                rentDate: req.createdAt ? req.createdAt.split('T')[0] : ''
            };

            window.postMessage({ type: "SEND_TO_POLICE_BOT", payload: tenantPayload }, "*");
            alert("✅ Data sent to Police Bot successfully! Now open MP Police Portal.");
        }

        async function downloadImage(imageUrl, fileName) {
            if (!imageUrl || imageUrl.includes('placehold.co')) { alert('Photo upload nahi hui hai!'); return; }
            try {
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = fileName;
                document.body.appendChild(a); a.click();
                window.URL.revokeObjectURL(url); document.body.removeChild(a);
            } catch (error) { window.open(imageUrl, '_blank'); }
        }

        function makeCopyRow(label, value, reqId, fieldKey) {
            const uniqueId = fieldKey + '_' + reqId;
            return `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#f9f9f9; padding:8px; margin-bottom:5px; border-radius:4px; border-left: 3px solid #3498db;">
                    <div style="flex:1;">
                        <strong style="color:#7f8c8d; font-size:12px;">${label}:</strong><br>
                        <span id="${uniqueId}" style="color:#2c3e50; font-size:14px; font-weight:bold;">${value}</span>
                    </div>
                    <button id="btn_${uniqueId}" onclick="copyText('${uniqueId}')" style="background:#3498db; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold;">📋 Copy</button>
                </div>
            `;
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('btn_' + elementId);
                btn.innerText = '✅ Copied!'; btn.style.background = '#2ecc71';
                setTimeout(() => { btn.innerText = '📋 Copy'; btn.style.background = '#3498db'; }, 1500);
            });
        }

        function closeModal() { document.getElementById('copyDataModal').style.display = 'none'; }

        async function uploadPdfAndMarkDone(id) {
            const fileInput = document.getElementById(`pdf_${id}`);
            if (fileInput.files.length === 0) { alert("❌ PDF सेलेक्ट करें!"); return; }
            const btn = fileInput.nextElementSibling;
            btn.innerText = "Uploading... ⏳"; btn.disabled = true;

            const formData = new FormData(); formData.append('verificationDoc', fileInput.files[0]);
            try {
                const res = await fetch(`/api/admin/upload-verification-doc/${id}`, { method: 'POST', body: formData });
                const result = await res.json();
                if (result.success) { alert(result.message); loadVerificationRequests(); } 
                else { alert("Upload fail!"); btn.innerText = "Upload PDF & Mark Done ✔️"; btn.disabled = false; }
            } catch (error) { alert("Server error!"); }
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
