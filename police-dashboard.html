<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Agent Dashboard - Bhopal Properties</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        header { background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; font-size: 14px; vertical-align: top; }
        th { background-color: #34495e; color: white; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .status-Pending { background-color: #f1c40f; color: #2c3e50; }
        .status-Done { background-color: #2ecc71; color: white; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-top: 5px; }
        .btn-done { background-color: #2ecc71; color: white; width: 100%; }
        .btn-pending { background-color: #95a5a6; color: white; width: 100%; }
        .pdf-input { width: 100%; margin-bottom: 5px; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; font-size: 20px;">👮 Police Verification Agent Panel</div>
        <div>
            <span id="agentName" style="margin-right: 20px; font-weight: 500;">Welcome, Agent</span>
            <button onclick="logout()" class="logout-btn">Log Out</button>
        </div>
    </header>

    <div class="container">
        <h2>Tenant Verification Requests (Leads)</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Tenant Details</th>
                        <th>Address & PS</th>
                        <th>Owner Details</th>
                        <th>Status</th>
                        <th>Action (Upload PDF)</th>
                    </tr>
                </thead>
                <tbody id="verificationTableBody">
                    <tr><td colspan="6" style="text-align: center; padding: 20px;">Data load ho raha hai... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const role = localStorage.getItem('userRole');
            if (role !== 'police_agent' && role !== 'admin') {
                window.location.href = 'login.html'; return;
            }
            document.getElementById('agentName').innerText = `Welcome, ${localStorage.getItem('brokerName') || 'Agent'}`;
            loadVerificationRequests();
        });

        async function loadVerificationRequests() {
            try {
                const res = await fetch('/api/admin/verifications');
                const result = await res.json();
                const tableBody = document.getElementById('verificationTableBody');
                tableBody.innerHTML = '';
                
                if (result.requests.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Koi request nahi mili.</td></tr>`; return;
                }
                
                result.requests.forEach(req => {
                    const statusClass = `status-${req.status}`;
                    
                    // 🚨 NAYA: PDF Upload box aur button
                    let actionHtml = '';
                    if (req.status === 'Pending') {
                        actionHtml = `
                            <input type="file" id="pdf_${req._id}" accept="application/pdf" class="pdf-input">
                            <button class="action-btn btn-done" onclick="uploadPdfAndMarkDone('${req._id}')">Upload PDF & Mark Done ✔️</button>
                        `;
                    } else {
                        const docLink = req.documentUrl ? `<a href="${req.documentUrl}" target="_blank" style="color: #2980b9; font-weight:bold; font-size: 13px; display:block; margin-bottom:5px;">📄 View Verified PDF</a>` : '';
                        actionHtml = `
                            ${docLink}
                            <button class="action-btn btn-pending" onclick="toggleStatus('${req._id}', 'Pending')">Mark Pending ⏳</button>
                        `;
                    }

                    tableBody.innerHTML += `
                        <tr>
                            <td><img src="${req.tenantPhoto || 'https://placehold.co/60x60?text=User'}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 4px;"></td>
                            <td><strong>Name:</strong> ${req.tenantName}<br><strong>Phone:</strong> ${req.tenantPhone}<br><strong>Aadhar:</strong> ${req.aadharNumber}</td>
                            <td><strong>Permanent:</strong> ${req.tenantPermanentAddress} (PS: ${req.permanentPoliceStation})<br><strong>Current:</strong> ${req.propertyAddress} (PS: ${req.currentPoliceStation})</td>
                            <td><strong>Owner:</strong> ${req.ownerName}<br><strong>Phone:</strong> ${req.ownerPhone}</td>
                            <td><span class="status-badge ${statusClass}">${req.status}</span></td>
                            <td style="min-width: 160px;">${actionHtml}</td>
                        </tr>
                    `;
                });
            } catch (error) { console.error(error); }
        }

        // 🚨 NAYA: PDF upload karne ka function
        async function uploadPdfAndMarkDone(id) {
            const fileInput = document.getElementById(`pdf_${id}`);
            if (fileInput.files.length === 0) {
                alert("❌ कृपया पहले पुलिस वेरिफिकेशन की PDF फाइल सेलेक्ट करें!"); return;
            }

            const btn = fileInput.nextElementSibling;
            btn.innerText = "Uploading... ⏳";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('verificationDoc', fileInput.files[0]);

            try {
                const res = await fetch(`/api/admin/upload-verification-doc/${id}`, { method: 'POST', body: formData });
                const result = await res.json();
                if (result.success) {
                    alert(result.message); loadVerificationRequests();
                } else { alert("Upload fail!"); btn.innerText = "Upload PDF & Mark Done ✔️"; btn.disabled = false; }
            } catch (error) { alert("Server error!"); }
        }

        async function toggleStatus(id, status) {
            try {
                await fetch(`/api/admin/change-verification-status/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ newStatus: status }) });
                loadVerificationRequests();
            } catch (error) { alert("Status update fail!"); }
        }

        function logout() {
            if (localStorage.getItem('realAdmin') === 'yes') {
                localStorage.setItem('userRole', 'admin'); localStorage.removeItem('realAdmin');
                localStorage.setItem('brokerName', 'Admin'); localStorage.setItem('brokerEmail', 'devilking786k@sahu.com'); 
                window.location.href = 'admin-dashboard.html';
            } else { localStorage.clear(); window.location.href = 'login.html'; }
        }
    </script>
</body>
</html>
