<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Employee ID Card - bhopal-real-estate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; min-height: 100vh; padding: 30px 15px; display: flex; justify-content: center; align-items: flex-start; }

        .container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }

        /* 📝 इनपुट फॉर्म स्टाइल */
        .form-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid #f59e0b;
        }
        .form-box h2 {
            font-size: 18px;
            color: #1e1b4b;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }
        .form-group input, .form-group textarea {
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #f59e0b;
        }

        /* 🪪 आईडी कार्ड स्टाइल (प्रिंट लेआउट) */
        .card-preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .id-card-wrapper {
            width: 320px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .card-header {
            background: linear-gradient(135deg, #1e1b4b, #2e2a72);
            padding: 20px 15px 35px;
            color: white;
            border-bottom: 3px solid #f59e0b;
        }
        .brand-title {
            font-size: 17px;
            font-weight: 800;
        }
        .brand-title span { color: #27ae60; }
        .tagline {
            font-size: 9px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .photo-container {
            margin-top: -38px;
            display: flex;
            justify-content: center;
        }
        .employee-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            background: #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .card-body {
            padding: 10px 18px 15px;
        }
        .emp-name {
            font-size: 17px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 2px;
        }
        .emp-role {
            font-size: 10px;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .details-table {
            width: 100%;
            font-size: 11px;
            text-align: left;
            margin-bottom: 12px;
            border-collapse: collapse;
        }
        .details-table td {
            padding: 4px 0;
            border-bottom: 1px dashed #f1f5f9;
            vertical-align: top;
        }
        .details-table td.label {
            color: #64748b;
            font-weight: 600;
            width: 38%;
        }
        .details-table td.value {
            color: #0f172a;
            font-weight: 600;
            word-break: break-word;
        }

        .card-footer {
            background: #f8fafc;
            padding: 8px 12px;
            font-size: 9px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            line-height: 1.4;
        }

        .print-btn {
            background: #1e1b4b;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            width: 100%;
        }
        .download-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            margin-top: 15px;
            width: 100%;
        }

        /* 🖨️ केवल कार्ड प्रिंट होगा */
        @media print {
            body { background: white; padding: 0; }
            .form-box, .print-btn, .download-btn { display: none !important; }
            .container { display: block; }
            .id-card-wrapper { box-shadow: none; border: 1px solid #000; margin: 0 auto; }
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCardContainer" style="display: none;">
        <!-- 📝 डायनामिक इनपुट फॉर्म -->
        <div class="form-box">
            <h2>
                <span>कर्मचारी विवरण (bhopal-real-estate)</span>
                <a href="dashboard.html" style="font-size: 12px; color: #3b82f6; text-decoration: none;">⬅️ Back</a>
            </h2>
            <div class="form-group">
                <label>प्रोफ़ाइल फोटो (Upload Photo)</label>
                <input type="file" id="inputPhoto" accept="image/*" onchange="previewPhoto(event)">
            </div>
            <div class="form-group">
                <label>कर्मचारी आईडी (Employee ID)</label>
                <input type="text" id="inputEmpId" placeholder="e.g. BRE-2026-001" oninput="updateCard()">
            </div>
            <div class="form-group">
                <label>कर्मचारी का पूरा नाम (Full Name)</label>
                <input type="text" id="inputName" placeholder="e.g. your name" oninput="updateCard()">
            </div>
            <div class="form-group">
                <label>जन्म तिथि (Date of Birth)</label>
                <input type="date" id="inputDob" onchange="updateCard()">
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर (Contact Number)</label>
                <input type="tel" id="inputPhone" placeholder="e.g. +91 9876543210" oninput="updateCard()">
            </div>
            <div class="form-group">
                <label>पद / भूमिका (Designation/Role)</label>
                <input type="text" id="inputRole" placeholder="e.g. Field Officer / Employer" oninput="updateCard()">
            </div>
            <div class="form-group">
                <label>पता (Permanent Address)</label>
                <textarea id="inputAddress" rows="2" placeholder="e.g. Zone 1, MP Nagar, Bhopal" oninput="updateCard()"></textarea>
            </div>
        </div>

        <!-- 🪪 लाइव प्रीव्यू कार्ड -->
        <div class="card-preview-area">
            <div class="id-card-wrapper" id="printableCard">
                <div class="card-header">
                    <div class="brand-title">bhopal-<span>real-estate</span></div>
                    <div class="tagline">Official Verification Identity Card</div>
                </div>

                <div class="photo-container">
                    <img id="cardPhoto" src="https://placehold.co/150x150?text=Photo" alt="Employee Photo" class="employee-photo" crossorigin="anonymous">
                </div>

                <div class="card-body">
                    <div class="emp-name" id="cardName">Agent Name</div>
                    <div class="emp-role" id="cardRole">Field Officer</div>

                    <table class="details-table">
                        <tr>
                            <td class="label">Emp ID:</td>
                            <td class="value" id="cardEmpId">BRE-2026-001</td>
                        </tr>
                        <tr>
                            <td class="label">DOB:</td>
                            <td class="value" id="cardDob">DD/MM/YYYY</td>
                        </tr>
                        <tr>
                            <td class="label">Contact:</td>
                            <td class="value" id="cardPhone">+91 XXXXX XXXXX</td>
                        </tr>
                        <tr>
                            <td class="label">Address:</td>
                            <td class="value" id="cardAddress">Bhopal, MP</td>
                        </tr>
                    </table>
                </div>

                <div class="card-footer">
                    Authorized Member of <strong>bhopal-real-estate</strong><br>
                    Portal: bhopal-real-estate.onrender.com
                </div>
            </div>

            <button class="download-btn" onclick="downloadCardImage()">📥 Download PVC Card (PNG)</button>
            <button class="print-btn" onclick="window.print()">🖨️ Print ID Card</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const email = localStorage.getItem('brokerEmail') || localStorage.getItem('userEmail');
            if (!email) {
                alert("⚠️ Kripya pehle login karein!");
                window.location.href = 'login.html';
                return;
            }

            try {
                // 🛡️ Server se live check karein ki user identity kya hai
                const res = await fetch(`/api/get-profile?email=${encodeURIComponent(email)}`);
                const profile = await res.json();

                const serverRole = (profile.role || localStorage.getItem('userRole') || 'user').toLowerCase();
                const allowedRoles = ['employee', 'employer', 'agent', 'admin', 'staff', 'field_officer'];

                if (!profile.isEligibleForIdCard && !allowedRoles.includes(serverRole)) {
                    alert("🚫 Access Denied! Aapka account 'User' category me hai. PVC ID Card sirf Authorized Employees aur Employers ke liye hai.");
                    window.location.href = 'dashboard.html';
                    return;
                }

                // ✅ Identity verified! Show container and auto-fill details
                document.getElementById('mainCardContainer').style.display = 'grid';

                const params = new URLSearchParams(window.location.search);
                const savedCardData = JSON.parse(localStorage.getItem('verifiedIdCardData') || '{}');

                const empId = params.get('empId') || profile.empId || savedCardData.empId || `BRE-2026-${profile.phone ? profile.phone.slice(-4) : '101'}`;
                const name = params.get('name') || profile.name || savedCardData.name || localStorage.getItem('brokerName') || '';
                const dob = params.get('dob') || profile.dob || savedCardData.dob || '';
                const phone = params.get('phone') || profile.phone || savedCardData.phone || '';
                const role = params.get('role') || savedCardData.role || (serverRole === 'employer' ? 'Authorized Employer' : 'Official Field Executive');
                const address = params.get('address') || savedCardData.address || ((profile.dealingAreas && profile.dealingAreas.length > 0) ? `${profile.dealingAreas.join(', ')}, Bhopal` : 'Bhopal, MP');
                const photo = params.get('photo') || profile.photo || savedCardData.photo || '';

                document.getElementById('inputEmpId').value = empId;
                document.getElementById('inputName').value = name;
                document.getElementById('inputDob').value = dob;
                document.getElementById('inputPhone').value = phone;
                document.getElementById('inputRole').value = role;
                document.getElementById('inputAddress').value = address;
                if (photo) {
                    document.getElementById('cardPhoto').src = photo;
                }

                updateCard();
            } catch (err) {
                console.error("Verification error:", err);
                alert("Server verification failed!");
                window.location.href = 'dashboard.html';
            }
        });

        // 🔄 लाइव कार्ड अपडेट फंक्शन
        function updateCard() {
            const empId = document.getElementById('inputEmpId').value.trim();
            const name = document.getElementById('inputName').value.trim();
            const dob = document.getElementById('inputDob').value;
            const phone = document.getElementById('inputPhone').value.trim();
            const role = document.getElementById('inputRole').value.trim();
            const address = document.getElementById('inputAddress').value.trim();

            document.getElementById('cardEmpId').innerText = empId || "BRE-2026-001";
            document.getElementById('cardName').innerText = name || "Agent Name";
            document.getElementById('cardRole').innerText = role || "Field Officer";
            document.getElementById('cardPhone').innerText = phone ? (phone.startsWith('+91') ? phone : `+91 ${phone}`) : "+91 XXXXX XXXXX";
            document.getElementById('cardAddress').innerText = address || "Bhopal, MP";

            if (dob) {
                const formattedDob = new Date(dob).toLocaleDateString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                document.getElementById('cardDob').innerText = formattedDob;
            } else {
                document.getElementById('cardDob').innerText = "DD/MM/YYYY";
            }
        }

        // 📸 फोटो प्रीव्यू फंक्शन
        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('cardPhoto').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // 📥 कार्ड को सीधा इमेज (PNG) के रूप में डाउनलोड करें
        function downloadCardImage() {
            const cardElement = document.getElementById('printableCard');
            html2canvas(cardElement, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                const empName = document.getElementById('inputName').value.trim() || 'Member';
                link.download = `bhopal-real-estate-ID-${empName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
