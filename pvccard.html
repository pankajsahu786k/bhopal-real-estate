<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Employee ID Card - Bhopal Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; min-height: 100vh; padding: 30px 15px; display: flex; justify-content: center; align-items: flex-start; }

        .container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }

        /* 📝 इनपुट फॉर्म स्टाइल */
        .form-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 4px solid #f59e0b;
        }
        .form-box h2 {
            font-size: 18px;
            color: #1e1b4b;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }
        .form-group input, .form-group textarea {
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #f59e0b;
        }

        /* 🪪 आईडी कार्ड स्टाइल (प्रिंट लेआउट) */
        .card-preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .id-card-wrapper {
            width: 320px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .card-header {
            background: linear-gradient(135deg, #1e1b4b, #2e2a72);
            padding: 20px 15px 35px;
            color: white;
            border-bottom: 3px solid #f59e0b;
        }
        .brand-title {
            font-size: 17px;
            font-weight: 800;
        }
        .brand-title span { color: #27ae60; }
        .tagline {
            font-size: 9px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .photo-container {
            margin-top: -38px;
            display: flex;
            justify-content: center;
        }
        .employee-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            background: #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .card-body {
            padding: 10px 18px 15px;
        }
        .emp-name {
            font-size: 17px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 2px;
        }
        .emp-role {
            font-size: 10px;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .details-table {
            width: 100%;
            font-size: 11px;
            text-align: left;
            margin-bottom: 12px;
            border-collapse: collapse;
        }
        .details-table td {
            padding: 4px 0;
            border-bottom: 1px dashed #f1f5f9;
            vertical-align: top;
        }
        .details-table td.label {
            color: #64748b;
            font-weight: 600;
            width: 38%;
        }
        .details-table td.value {
            color: #0f172a;
            font-weight: 600;
            word-break: break-word;
        }

        .card-footer {
            background: #f8fafc;
            padding: 8px 12px;
            font-size: 9px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            line-height: 1.4;
        }

        .print-btn {
            background: #1e1b4b;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            margin-top: 15px;
            width: 100%;
        }

        /* 🖨️ केवल कार्ड प्रिंट होगा */
        @media print {
            body { background: white; padding: 0; }
            .form-box, .print-btn { display: none !important; }
            .container { display: block; }
            .id-card-wrapper { box-shadow: none; border: 1px solid #000; margin: 0 auto; }
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 📝 डायनामिक इनपुट फॉर्म -->
        <div class="form-box">
            <h2>कर्मचारी विवरण भरें (Dynamic Form)</h2>
            <div class="form-group">
                <label>प्रोफ़ाइल फोटो (Upload Photo)</label>
                <input type="file" id="inputPhoto" accept="image/*" onchange="previewPhoto(event)">
            </div>
            <div class="form-group">
                <label>कर्मचारी का पूरा नाम (Full Name)</label>
                <input type="text" id="inputName" placeholder="e.g. your name" oninput="updateCard()">
            </div>
            <div class="form-group">
                <label>जन्म तिथि (Date of Birth)</label>
                <input type="date" id="inputDob" onchange="updateCard()">
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर (Contact Number)</label>
                <input type="tel" id="inputPhone" placeholder="e.g. +91 9876543210" oninput="updateCard()">
            </div>
            <div class="form-group">
                <label>पद / भूमिका (Designation/Role)</label>
                <input type="text" id="inputRole" placeholder="e.g. Field Officer / Broker" oninput="updateCard()">
            </div>
            <div class="form-group">
                <label>पता (Permanent Address)</label>
                <textarea id="inputAddress" rows="2" placeholder="e.g. Zone 1, MP Nagar, Bhopal" oninput="updateCard()"></textarea>
            </div>
        </div>

        <!-- 🪪 लाइव प्रीव्यू कार्ड -->
        <div class="card-preview-area">
            <div class="id-card-wrapper">
                <div class="card-header">
                    <div class="brand-title">Bhopal <span>Properties</span></div>
                    <div class="tagline">Official Verification Agent</div>
                </div>

                <div class="photo-container">
                    <img id="cardPhoto" src="https://placehold.co/150x150?text=Photo" alt="Employee Photo" class="employee-photo">
                </div>

                <div class="card-body">
                    <div class="emp-name" id="cardName">Agent Name</div>
                    <div class="emp-role" id="cardRole">Field Officer</div>

                    <table class="details-table">
                        <tr>
                            <td class="label">Emp ID:</td>
                            <td class="value" id="cardEmpId">BP-2026-001</td>
                        </tr>
                        <tr>
                            <td class="label">DOB:</td>
                            <td class="value" id="cardDob">DD/MM/YYYY</td>
                        </tr>
                        <tr>
                            <td class="label">Contact:</td>
                            <td class="value" id="cardPhone">+91 XXXXX XXXXX</td>
                        </tr>
                        <tr>
                            <td class="label">Address:</td>
                            <td class="value" id="cardAddress">Bhopal, MP</td>
                        </tr>
                    </table>
                </div>

                <div class="card-footer">
                    Authorized Agent of Bhopal Properties Network.<br>
                    Helpline: support@bhopalproperties.com
                </div>
            </div>

            <button class="print-btn" onclick="window.print()">🖨️ Print ID Card</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // यदि यूजर पहले से लॉगिन है तो उसका नाम और ईमेल स्वतः भर लें
            const savedName = localStorage.getItem('brokerName') || localStorage.getItem('username');
            if (savedName) {
                document.getElementById('inputName').value = savedName;
            }
            updateCard();
        });

        // 🔄 लाइव कार्ड अपडेट फंक्शन
        function updateCard() {
            const name = document.getElementById('inputName').value.trim();
            const dob = document.getElementById('inputDob').value;
            const phone = document.getElementById('inputPhone').value.trim();
            const role = document.getElementById('inputRole').value.trim();
            const address = document.getElementById('inputAddress').value.trim();

            document.getElementById('cardName').innerText = name || "Agent Name";
            document.getElementById('cardRole').innerText = role || "Field Officer";
            document.getElementById('cardPhone').innerText = phone || "+91 XXXXX XXXXX";
            document.getElementById('cardAddress').innerText = address || "Bhopal, MP";

            if (dob) {
                const formattedDob = new Date(dob).toLocaleDateString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                document.getElementById('cardDob').innerText = formattedDob;
            } else {
                document.getElementById('cardDob').innerText = "DD/MM/YYYY";
            }
        }

        // 📸 फोटो प्रीव्यू फंक्शन
        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('cardPhoto').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
